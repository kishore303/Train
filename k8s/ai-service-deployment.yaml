apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: ai-service}}
  template:
    metadata: {labels: {app: ai-service}}
    spec:
      containers:
      - name: ai-service
        image: sih26027/ai-service:latest
        ports: [{containerPort: 8000}]
        env: [{name: DEMO_MODE, value: "true"}]
---
apiVersion: v1
kind: Service
metadata: {name: ai-service}
spec:
  selector: {app: ai-service}
  ports: [{port: 8000, targetPort: 8000}]
