version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["4200:80"]
    depends_on: [backend]
    environment: [DEMO_MODE=true]

  backend:
    build:
      context: ./backend
    ports: ["3000:3000"]
    depends_on: [ai-service, redis, kafka]
    environment:
      - DEMO_MODE=true
      - PORT=3000
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=sih26027-secret-key-demo
    volumes: ["./backend/data:/app/data"]

  ai-service:
    build:
      context: ./ai-service
    ports: ["8000:8000"]
    environment: [DEMO_MODE=true]
    volumes: ["./ai-service:/app"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --save "" --appendonly no

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    # fallback to in-memory if not healthy

  temporal:
    image: temporalio/auto-setup:1.26
    ports: ["7233:7233","8233:8233"]
    environment: [DEMO_MODE=true]
    # local state-machine fallback if unavailable

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment: [GF_SECURITY_ADMIN_PASSWORD=admin]
    volumes: ["./monitoring/grafana-dashboard.json:/etc/grafana/dashboards/dashboard.json"]
